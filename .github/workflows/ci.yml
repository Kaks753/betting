name: KBet CI

on:
  push:
    branches: [ main, genspark_ai_developer ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Week 2 tests
      run: |
        python -m pytest kbet/tests/test_week2.py -v --tb=short \
          -k "not DailyCard" \
          --junit-xml=test-results-week2.xml

    - name: Run Week 3 tests
      run: |
        python -m pytest kbet/tests/test_week3.py -v --tb=short \
          --junit-xml=test-results-week3.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}
        path: test-results-*.xml

    - name: Verify API imports
      run: |
        python -c "from kbet.api.app import app; print('API OK')"
        python -c "from kbet.engine.utils.kelly import kelly_stake; print('Kelly OK')"
        python -c "from kbet.engine.utils.clv_tracker import compute_clv; print('CLV OK')"
        python -c "from kbet.db import Database; print('DB OK')"
