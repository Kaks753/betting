# Render.com deployment config
# Deploy from GitHub: https://render.com → New Web Service → Connect repo
#
# FREE PLAN NOTES:
#   - No persistent disk on free plan (paid: $7/month for 1GB disk)
#   - Model cache in /tmp survives within same machine session only
#   - With model caching: first run ~5min (fits+saves), repeat runs ~15sec
#   - DB resets on redeploy (bets history lost) — use Fly.io if history is critical
#
# PAID PLAN ($7/month disk):
#   - Add disk block below and set DATA_DIR=/data for full persistence

services:
  - type: web
    name: kbet-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn kbet.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ODDS_API_KEY
        sync: false        # Set in Render dashboard → Environment → ODDS_API_KEY
      - key: ADMIN_TOKEN
        sync: false        # Set a secret value in dashboard
      - key: BANKROLL
        value: "1000"
      - key: MAX_BETS
        value: "10"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: DATA_DIR
        value: "/tmp/kbet_data"   # Ephemeral on free plan; change to /data with paid disk
      # Uncomment below for paid plan with persistent disk ($7/month):
      # - key: DATA_DIR
      #   value: "/data"

  # Uncomment to add 1GB persistent disk (paid plan only, $7/month):
  # disk:
  #   name: kbet-data
  #   mountPath: /data
  #   sizeGB: 1

cron:
  # Daily card at 10:00 UTC — triggers cron_runner.py
  - name: kbet-daily-cron
    runtime: python
    plan: free
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 kbet/cron_runner.py --card-only
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BANKROLL
        value: "1000"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: DATA_DIR
        value: "/tmp/kbet_data"
