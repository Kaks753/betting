# Render.com deployment config
# Live at: https://kbet-7fyx.onrender.com
#
# FREE PLAN NOTES:
#   - No persistent disk on free plan (paid: $7/month for 1GB disk)
#   - Model cache in /tmp/kbet_data — survives within the same machine uptime
#   - First run: ~5 min (fits Dixon-Coles model, saves to /tmp)
#   - Repeat runs: ~15 sec (loads from cache)
#   - DB is stored inside the container at /app/kbet/data/kbet.db
#     → resets on redeploy; use paid disk for persistence
#   - Use Fly.io (free, 3GB persistent) if you need history across redeploys
#
# PAID PLAN ($7/month disk):
#   - Uncomment disk block + change DATA_DIR=/data for full persistence
#
# On startup: the API auto-generates today's card in the background.
# Visit / for the dashboard UI.

services:
  - type: web
    name: kbet-api
    runtime: docker           # Use Dockerfile for consistent Python 3.11 env
    plan: free
    healthCheckPath: /status  # Render polls this — returns 200 OK
    envVars:
      - key: ODDS_API_KEY
        sync: false           # Set in Render Dashboard → Environment
      - key: ADMIN_TOKEN
        sync: false           # Set in Render Dashboard → Environment
      - key: BANKROLL
        value: "1000"
      - key: MAX_BETS
        value: "10"
      - key: DATA_DIR
        value: "/tmp/kbet_data"   # In-process cache; change to /data with paid disk
      # For paid disk ($7/month), uncomment:
      # - key: DATA_DIR
      #   value: "/data"

  # Uncomment for 1GB persistent disk (paid plan, $7/month):
  # disk:
  #   name: kbet-data
  #   mountPath: /data
  #   sizeGB: 1

cron:
  # Daily card generation at 10:00 UTC
  - name: kbet-daily-cron
    runtime: docker
    plan: free
    schedule: "0 10 * * *"
    dockerCommand: python3 kbet/cron_runner.py --card-only
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BANKROLL
        value: "1000"
      - key: DATA_DIR
        value: "/tmp/kbet_data"
